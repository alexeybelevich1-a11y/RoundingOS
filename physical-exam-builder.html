<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physical Exam Quick-Builder — standalone preview</title>
<style>
:root {
  --bg-app: #f3f5f8;
  --bg-surface: #ffffff;
  --bg-subtle: #f7f8fa;
  --bg-hover: #eef1f5;
  --bg-selected: #eaf4f3;
  --border: #e3e7ed;
  --border-strong: #cdd4de;

  --text-primary: #111827;
  --text-secondary: #4b5563;
  --text-muted: #6b7280;

  --accent: #0f766e;
  --accent-hover: #0d9488;
  --accent-soft: #e6f4f2;
  --accent-text: #0f5f59;

  --sick: #dc2626;      --sick-bg: #fdf0f0;      --sick-border: #f5c2c2;
  --watcher: #c26a04;   --watcher-bg: #fdf6e9;   --watcher-border: #f3d79c;
  --discharge: #0369a1; --discharge-bg: #eef6fb; --discharge-border: #bfdcef;
  --stable: #15803d;    --stable-bg: #eef8f1;    --stable-border: #bfe3cb;

  --done-solid: #16a34a; --done-solid-hover: #15803d;

  --voice: #6d28d9;
  --voice-bg: #f4f0fd;
  --voice-active: #dc2626;

  --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.05);
  --shadow-md: 0 4px 14px rgba(17, 24, 39, 0.08);
  --shadow-lg: 0 18px 40px rgba(17, 24, 39, 0.18);

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;

  --fs-sm: 12px; --fs-md: 13.5px; --fs-lg: 15px; --fs-xl: 20px;

  --font-sans: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  --font-mono: "Cascadia Code", "Consolas", "SFMono-Regular", monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg-app); color: var(--text-primary);
  font-family: var(--font-sans); font-size: var(--fs-md); line-height: 1.45;
}
.standalone-note {
  background: var(--discharge-bg); border-bottom: 1px solid var(--discharge-border);
  color: var(--discharge); font-size: 12.5px; padding: 7px 16px; text-align: center;
}
.shell { height: calc(100vh - 34px); display: flex; flex-direction: column; overflow: hidden; }
.modal-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-surface); flex-shrink: 0;
}
.modal-header h2 { margin: 0; font-size: 16px; }
.small-muted { font-size: var(--fs-sm); color: var(--text-muted); }
.btn {
  border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary);
  border-radius: var(--radius-sm); padding: 7px 14px; font: 600 var(--fs-md) var(--font-sans); cursor: pointer;
}
.btn-xs { padding: 3px 9px; font-size: 11.5px; }
.btn-sm { padding: 6px 12px; font-size: var(--fs-sm); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-secondary { background: var(--bg-subtle); }
.btn-ghost { background: none; border-color: transparent; color: var(--text-muted); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link-btn {
  background: none; border: none; color: var(--accent); font: 600 11.5px var(--font-sans);
  cursor: pointer; padding: 0;
}
.segmented-control {
  display: inline-flex; background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 3px; gap: 2px; flex-wrap: wrap;
}
.seg-btn {
  padding: 5px 12px; border: none; border-radius: 4px; background: none;
  color: var(--text-secondary); font: 600 var(--fs-sm) var(--font-sans); cursor: pointer;
}
.seg-btn.active { background: var(--bg-surface); color: var(--text-primary); box-shadow: var(--shadow-sm); }
textarea, input[type=text] {
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--bg-surface); color: var(--text-primary);
  font-family: var(--font-sans); font-size: var(--fs-md); padding: 7px 9px; width: 100%;
}
textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.hidden { display: none !important; }
/* standalone: the builder is the whole page, so Escape must not hide it */
#examBuilderModal.hidden { display: flex !important; }

.field-head-actions { display: inline-flex; gap: 10px; align-items: center; }

.pe-header-right { display: flex; gap: 6px; align-items: center; }

.pe-presets-bar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  padding: 8px 16px; background: var(--bg-subtle);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}

.pe-main {
  display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.85fr);
  flex: 1; min-height: 0; overflow: hidden;
}

.pe-systems-col {
  overflow-y: auto; padding: 12px 16px 20px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 10px; align-content: start;
}

.pe-sys-card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 10px 12px;
  display: flex; flex-direction: column; gap: 7px;
}
.pe-sys-card.has-abnormal { border-color: var(--sick-border); box-shadow: inset 3px 0 0 var(--sick); }

.pe-sys-head {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding-bottom: 5px; border-bottom: 1px solid var(--border);
}
.pe-sys-title { font-size: 12.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.pe-chip-group-lbl {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 3px;
}
.pe-chips { display: flex; flex-wrap: wrap; gap: 5px; }

.pe-chip {
  border: 1px solid var(--border-strong); background: var(--bg-subtle);
  color: var(--text-secondary); border-radius: 999px; padding: 3px 9px;
  font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.pe-chip:hover { border-color: var(--text-muted); }
.pe-chip.active.kind-normal   { background: var(--stable-bg); border-color: var(--stable-border); color: var(--stable); }
.pe-chip.active.kind-abnormal { background: var(--sick-bg); border-color: var(--sick-border); color: var(--sick); }
.pe-chip.active.kind-modifier { background: var(--discharge-bg); border-color: var(--discharge-border); color: var(--discharge); }

.pe-manual-input { width: 100%; font-size: 12px; padding: 5px 8px; }

.pe-preview-col {
  border-left: 1px solid var(--border); background: var(--bg-subtle);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; min-height: 0;
}
.pe-preview-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pe-preview-head .segmented-control { margin-left: auto; }
.pe-count { font-size: 11px; font-weight: 700; color: var(--text-muted); }
.pe-count.pe-count-abn { color: var(--sick); }

.pe-output-ta {
  flex: 1; min-height: 200px; resize: none;
  font-family: var(--font-sans); font-size: 13px; line-height: 1.58;
  padding: 10px 12px;
}
.pe-edited-warn { font-size: 11px; color: var(--discharge); font-weight: 600; }
.pe-manual-label { font-weight: 700; display: block; margin-bottom: 4px; }
.pe-actions { display: flex; gap: 8px; }
.pe-actions #peApplyToPatientBtn { flex: 1; }

@media (max-width: 960px) {
  .pe-main { grid-template-columns: 1fr; overflow-y: auto; }
  .pe-preview-col { border-left: none; border-top: 1px solid var(--border); }
}

/* Exam builder — searchable preset picker */
.pe-presets-bar { position: relative; z-index: 5; }
.pe-search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 460px; }
.pe-search-input {
  width: 100%; border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--bg-surface); color: var(--text-primary);
  font-family: inherit; font-size: 12.5px; padding: 6px 12px;
}
.pe-search-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

.pe-preset-panel {
  position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 20;
  max-height: 340px; overflow-y: auto;
  background: var(--bg-surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 5px;
}
.pe-preset-group {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-muted); padding: 7px 9px 3px;
}
.pe-preset-item {
  display: block; width: 100%; text-align: left; border: none; background: none;
  color: var(--text-primary); font: 600 12.5px var(--font-sans);
  padding: 6px 9px; border-radius: var(--radius-sm); cursor: pointer;
}
.pe-preset-item:hover { background: var(--bg-hover); }
.pe-preset-item.sel { background: var(--accent-soft); color: var(--accent-text); }
.pe-preset-empty { padding: 10px 9px; font-size: 12px; color: var(--text-muted); }
.pe-applied { font-size: 11.5px; font-weight: 700; color: var(--accent-text); }

</style>
</head>
<body>
<div class="standalone-note">
  Standalone preview — loads <code>exambuilder.js</code> from the same folder. In RoundingOS this is a modal and the button inserts into the patient's Physical Exam.
</div>

<div class="shell" id="examBuilderModal">
  <div class="modal-header">
    <div>
      <h2 id="examBuilderTitle">Physical Exam Quick-Builder</h2>
      <div class="small-muted" id="peModalPatientHint">Click findings to build the exam</div>
    </div>
    <div class="pe-header-right">
      <button type="button" class="btn btn-xs btn-secondary" id="peResetAllNormBtn">All normal</button>
      <button type="button" class="btn btn-xs btn-ghost" id="peClearAllBtn">Clear</button>
    </div>
  </div>

  <div class="pe-presets-bar" id="pePresetsBar"></div>

  <div class="pe-main">
    <section class="pe-systems-col" id="peSystemsGrid"></section>

    <aside class="pe-preview-col">
      <div class="pe-preview-head">
        <strong>Live physical exam</strong>
        <span class="pe-count" id="peAbnormalCount"></span>
        <div class="segmented-control" id="peFormatTabs">
          <button type="button" class="seg-btn active" data-fmt="multiline">Multi-line</button>
          <button type="button" class="seg-btn" data-fmt="compact">Compact</button>
        </div>
      </div>

      <textarea id="peOutputText" class="pe-output-ta" spellcheck="false"></textarea>
      <div class="pe-edited-warn hidden" id="peEditedWarn">Hand-edited — chip changes will no longer rewrite this box.</div>

      <div>
        <label for="peGlobalManual" class="small-muted pe-manual-label">Additional manual findings</label>
        <textarea id="peGlobalManual" rows="2" placeholder="e.g. R medial malleolus 2×2 cm ulcer, clean base…"></textarea>
      </div>

      <div class="pe-actions">
        <button type="button" class="btn btn-sm btn-primary" id="peCopyBtn" style="flex:1;">Copy exam</button>
      </div>
      <div class="small-muted" id="peToast" style="min-height:16px;"></div>
    </aside>
  </div>
</div>

<script src="exambuilder.js"></script>
<script src="physical-exam-builder.js"></script>
</body>
</html>
